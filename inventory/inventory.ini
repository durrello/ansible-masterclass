[node]
node1 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=devuser ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no'
node2 ansible_host=127.0.0.1 ansible_port=2223 ansible_user=devuser ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[web]
node1 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=devuser ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[db]
node2 ansible_host=127.0.0.1 ansible_port=2223 ansible_user=devuser ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[all:vars]
ansible_python_interpreter=/usr/bin/python3

